// ── Storage helpers ──────────────────────────────────────────────────────────

// ── Format helpers ───────────────────────────────────────────────────────────

const fmtD = d => { const[y,m,dy]=d.split('-').map(Number); return new Date(y,m-1,dy).toLocaleDateString('en-US',{month:'short',day:'numeric'}); };

const sign  = n => n >= 0 ? '+' : '';
const pct   = n => sign(n) + n.toFixed(2) + '%';

// ── Lot engine ───────────────────────────────────────────────────────────────
function calcLots(trades) {
  const lots = {};
  const closed = [];
  trades.filter(t => t.type==='buy'||t.type==='sell').forEach(t => {
    const key = t.ticker + '|' + t.account;
    if (t.type === 'buy') {
      if (!lots[key]) lots[key] = {ticker:t.ticker, account:t.account, shares:0, totalCost:0, firstDate:t.date};
      lots[key].shares    += +t.shares;
      lots[key].totalCost += +t.shares * +t.price;
    } else {
      const lot = lots[key];
      if (!lot || lot.shares <= 0) return;
      const avgCost   = lot.totalCost / lot.shares;
      const sold      = Math.min(+t.shares, lot.shares);
      const realGain  = (+t.price - avgCost) * sold;
      const gainPct   = ((+t.price - avgCost) / avgCost) * 100;
      const days      = lot.firstDate && t.date ? Math.round((new Date(t.date)-new Date(lot.firstDate))/86400000) : null;
      closed.push({id:t.id, ticker:t.ticker, account:t.account, shares:sold,
        avgCost, sellPrice:+t.price, date:t.date, reason:t.reason,
        realGain, gainPct, days});
      lot.totalCost -= sold * avgCost;
      lot.shares    -= sold;
      if (lot.shares <= 0) delete lots[key];
    }
  });
  const open = Object.values(lots).map(l => ({...l, avgCost: l.totalCost/l.shares}));
  return {open, closed};
}

// ── Schwab CSV parser ─────────────────────────────────────────────────────────
function parseSchwab(raw, account='Schwab') {
  raw = raw.replace(/^\uFEFF/, '');
  const lines = raw.trim().split('\n').map(l => l.trim()).filter(l => l);
  const n = s => parseFloat((s||'').replace(/[$,%]/g,'').replace(/,/g,'')) || 0;
  const rows = [];
  let header = null;
  for (const line of lines) {
    const cols = line.split('\t').map(c => c.trim());
    if (!header) { header = cols; continue; }
    const sym = cols[0];
    if (!sym || !/^[A-Z]{1,6}$/.test(sym)) continue;
    const qty       = n(cols[2]);
    const price     = n(cols[3]);
    const mktVal    = n(cols[6]);
    const costBasis = n(cols[9]);
    const gainDol   = n(cols[10]);
    const gainPct   = n(cols[11]);
    const low52     = n(cols[13]);
    const high52    = n(cols[14]);
    if (qty > 0 && price > 0) {
      rows.push({
        ticker: sym,
        shares: qty,
        price,
        value: mktVal || price * qty,
        costBasis,
        avgCost: qty > 0 ? costBasis / qty : 0,
        gainDol,
        gainPct,
        low52,
        high52,
        account,
      });
    }
  }
  return rows;
}

// ── Ally CSV parser ───────────────────────────────────────────────────────────
// Ally format: similar to Schwab, detect by columns
function parseAlly(raw) {
  // Ally exports vary — try tab-separated first, then comma
  raw = raw.replace(/^\uFEFF/, '');
  const delim = raw.includes('\t') ? '\t' : ',';
  const lines = raw.trim().split('\n').map(l => l.trim()).filter(l => l);
  const n = s => parseFloat((s||'').replace(/[$,%"]/g,'').replace(/,/g,'')) || 0;
  const rows = [];
  let header = null;
  let symIdx=-1, qtyIdx=-1, priceIdx=-1, costIdx=-1, gainIdx=-1, gainPctIdx=-1, valIdx=-1;
  for (const line of lines) {
    const cols = line.split(delim).map(c => c.trim().replace(/^"|"$/g,''));
    if (!header) {
      header = cols.map(c => c.toLowerCase());
      symIdx     = header.findIndex(c => c.includes('symbol') || c === 'sym');
      qtyIdx     = header.findIndex(c => c.includes('qty') || c.includes('quantity') || c.includes('shares'));
      priceIdx   = header.findIndex(c => c.includes('price') && !c.includes('chng') && !c.includes('52'));
      costIdx    = header.findIndex(c => c.includes('cost'));
      gainIdx    = header.findIndex(c => c.includes('gain') && !c.includes('%'));
      gainPctIdx = header.findIndex(c => c.includes('gain') && c.includes('%'));
      valIdx     = header.findIndex(c => c.includes('value') || c.includes('mkt val'));
      continue;
    }
    const sym = symIdx >= 0 ? cols[symIdx] : cols[0];
    if (!sym || !/^[A-Z]{1,6}$/.test(sym)) continue;
    const qty   = n(cols[qtyIdx >= 0 ? qtyIdx : 2]);
    const price = n(cols[priceIdx >= 0 ? priceIdx : 3]);
    const cost  = n(cols[costIdx >= 0 ? costIdx : 9]);
    const gain  = n(cols[gainIdx >= 0 ? gainIdx : 10]);
    const gainP = n(cols[gainPctIdx >= 0 ? gainPctIdx : 11]);
    const val   = n(cols[valIdx >= 0 ? valIdx : 6]);
    if (qty > 0 && price > 0) {
      rows.push({ticker:sym, shares:qty, price, value:val||price*qty,
        costBasis:cost, avgCost:qty>0?cost/qty:0,
        gainDol:gain, gainPct:gainP, account:'Ally'});
    }
  }
  return rows;
}

// ── Live price fetch (Finnhub) ────────────────────────────────────────────────
async function fetchPrice(ticker) {
  const settings = getSettings();
  const key = settings.finnhubKey || FINNHUB_KEY;
  if (!key) return null;
  try {
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${key}`);
    const d = await r.json();
    if (d.c) return {price:d.c, change:d.d, changePct:d.dp, high:d.h, low:d.l, prevClose:d.pc};
  } catch(e) {}
  return null;
}

async function fetchPrices(tickers) {
  const results = {};
  for (const t of tickers) {
    const p = await fetchPrice(t);
    if (p) results[t] = p;
    await new Promise(r => setTimeout(r, 200)); // rate limit
  }
  return results;
}


// ── Timing engine ─────────────────────────────────────────────────────────
function getTimingSignal(h, totalPortfolioVal, budget) {
  const currentWeight = totalPortfolioVal > 0 ? (h.value / totalPortfolioVal) * 100 : 0;
  const maxAdd = totalPortfolioVal * 0.05 - h.value; // room to 5%
  const today = h.todayPct || 0;

  // Timing quality based on today's move
  let timing, timingColor, timingIcon;
  if (today <= -3)      { timing='Strong dip — buy';   timingColor='#16a34a'; timingIcon='🟢'; }
  else if (today <= -1) { timing='Mild dip — buy';     timingColor='#22c55e'; timingIcon='🟢'; }
  else if (today <= 1)  { timing='Flat — neutral';     timingColor='#f59e0b'; timingIcon='🟡'; }
  else if (today <= 3)  { timing='Up — wait';          timingColor='#f97316'; timingIcon='🟠'; }
  else                  { timing='Extended — no chase'; timingColor='#dc2626'; timingIcon='🔴'; }

  // Week/month/6mo — pending Finnhub
  const pending = '<span style="color:#94a3b8;font-size:10px">📡 pending Finnhub</span>';

  // Position size suggestion
  let suggestedDol = 0;
  let suggestedShares = 0;
  let sizeNote = '';

  if (maxAdd <= 0) {
    sizeNote = 'At or above 5% limit — no add';
  } else if (today <= 1) {
    // Good or neutral entry — suggest up to half the room or $10K max
    suggestedDol = Math.min(maxAdd, budget * 0.4, 10000);
    suggestedShares = h.price > 0 ? Math.floor(suggestedDol / h.price) : 0;
    sizeNote = suggestedShares > 0 ? `~${suggestedShares}sh ($${Math.round(suggestedShares*h.price).toLocaleString()})` : 'Too small';
  } else {
    // Extended — small starter only
    suggestedDol = Math.min(maxAdd * 0.25, budget * 0.15, 3000);
    suggestedShares = h.price > 0 ? Math.floor(suggestedDol / h.price) : 0;
    sizeNote = suggestedShares > 0 ? `Starter only ~${suggestedShares}sh ($${Math.round(suggestedShares*h.price).toLocaleString()})` : 'Skip today';
  }

  // Price range — entry zone based on today's price ± buffer
  const entryLow  = h.price * (1 - 0.02);  // 2% below current
  const entryHigh = h.price * (1 + 0.01);  // 1% above current
  const rangeStr  = `$${entryLow.toFixed(2)} – $${entryHigh.toFixed(2)}`;

  return {
    timing, timingColor, timingIcon,
    currentWeight: currentWeight.toFixed(1),
    maxAdd: maxAdd > 0 ? `$${Math.round(maxAdd).toLocaleString()}` : null,
    sizeNote, suggestedDol, suggestedShares,
    rangeStr, pending,
    canAdd: maxAdd > 0 && today <= 3,
  };
}

// ── Recommendation engine ─────────────────────────────────────────────────────
function scorePosition(h, lot) {
  const signals = [];
  let score = 0;
  // Use manually entered Quant score if available
  const manualQuant = getQuant()[h.ticker];
  if (manualQuant) h = {...h, score: manualQuant};
  // Check portfolio intelligence
  const intel = getIntel()[h.ticker];
  if (intel) {
    if (intel.action === 'pass') {
      signals.push({label:'⛔ Pass: '+intel.reason.substring(0,60)+'…', weight:-999, icon:'⛔'});
      return {score:-999, verdict:'Pass', color:'#94a3b8', tag:'pass', signals, intel};
    }
    if (intel.action === 'watch') {
      signals.push({label:'👁 Watch: '+intel.reason.substring(0,60)+'…', weight:-10, icon:'👁'});
      score -= 10;
    }
    if (intel.action === 'hold' && intel.reason) {
      signals.push({label:'📋 History: '+intel.reason.substring(0,50)+'…', weight:0, icon:'📋'});
    }
  }

  // Signal 1: SA Quant
  if (h.score) {
    const isQ = h.score <= 5;
    if (isQ && h.score >= 4.5) { signals.push({label:'Strong Buy Quant', weight:+25, icon:'🟢'}); score += 25; }
    else if (isQ && h.score >= 4.0) { signals.push({label:'Buy Quant', weight:+15, icon:'🟢'}); score += 15; }
    else if (isQ && h.score >= 3.5) { signals.push({label:'Hold Quant', weight:0, icon:'🟡'}); }
    else if (isQ && h.score < 3.0) { signals.push({label:'Weak Quant', weight:-15, icon:'🔴'}); score -= 15; }
    else if (!isQ && h.score >= 8) { signals.push({label:'Smart Score '+h.score, weight:+20, icon:'🟢'}); score += 20; }
    else if (!isQ && h.score >= 6) { signals.push({label:'Smart Score '+h.score, weight:+5, icon:'🟡'}); score += 5; }
    else if (!isQ) { signals.push({label:'Smart Score '+h.score, weight:-10, icon:'🔴'}); score -= 10; }
  }

  // Signal 2: Analyst upside — >25% is explicit buy signal
  if (h.upside) {
    if (h.upside >= 40) { signals.push({label:'Upside '+h.upside.toFixed(0)+'%', weight:+25, icon:'🟢'}); score += 25; }
    else if (h.upside >= 25) { signals.push({label:'Upside '+h.upside.toFixed(0)+'%', weight:+20, icon:'🟢'}); score += 20; }
    else if (h.upside >= 15) { signals.push({label:'Upside '+h.upside.toFixed(0)+'%', weight:+5, icon:'🟡'}); score += 5; }
    else if (h.upside > 0) { signals.push({label:'Low upside '+h.upside.toFixed(0)+'%', weight:-10, icon:'🔴'}); score -= 10; }
  } else if (h.upside === 0 && h.score > 0) {
    // No upside data available — neutral, don't penalize
  } else if (!h.upside && !h.score) {
    signals.push({label:'No signal data', weight:0, icon:'⬜'});
  }

  // Signal 3: Momentum grade
  if (h.momentum) {
    if (h.momentum.startsWith('A')) { signals.push({label:'Momentum '+h.momentum, weight:+10, icon:'🟢'}); score += 10; }
    else if (h.momentum.startsWith('B')) { signals.push({label:'Momentum '+h.momentum, weight:+5, icon:'🟡'}); score += 5; }
    else if (h.momentum.startsWith('C')) { signals.push({label:'Momentum '+h.momentum, weight:0, icon:'🟡'}); }
    else if (h.momentum.startsWith('D')) { signals.push({label:'Momentum '+h.momentum, weight:-10, icon:'🔴'}); score -= 10; }
  }

  // Signal 4: Cost basis vs current (from Schwab lots)
  if (lot) {
    const lotGain = ((h.price - lot.avgCost) / lot.avgCost) * 100;
    if (lotGain < -20) { signals.push({label:'Down '+lotGain.toFixed(0)+'% from cost', weight:-15, icon:'🔴'}); score -= 15; }
    else if (lotGain > 50) { signals.push({label:'Up '+lotGain.toFixed(0)+'% from cost', weight:-5, icon:'🟡'}); score -= 5; }
    else if (lotGain > 25) { signals.push({label:'Up '+lotGain.toFixed(0)+'% from cost', weight:+5, icon:'🟢'}); score += 5; }
  }

  // Signal 5: Today momentum
  if (h.todayPct > 3) { signals.push({label:'Up '+h.todayPct.toFixed(1)+'% today', weight:+5, icon:'🟢'}); score += 5; }
  else if (h.todayPct < -3) { signals.push({label:'Down '+Math.abs(h.todayPct).toFixed(1)+'% today', weight:-5, icon:'🔴'}); score -= 5; }

  // Verdict
  let verdict, color, tag;
  if (score >= 40) { verdict='Strong Buy'; color='#16a34a'; tag='strong-buy'; }
  else if (score >= 20) { verdict='Buy'; color='#2563eb'; tag='buy'; }
  else if (score >= 0) { verdict='Hold'; color='#f59e0b'; tag='hold'; }
  else if (score >= -20) { verdict='Watch'; color='#f59e0b'; tag='watch'; }
  else { verdict='Trim'; color='#dc2626'; tag='trim'; }

  return {score, verdict, color, tag, signals};
}

// ── Claude AI recommendation ──────────────────────────────────────────────────
async function getAIRec(ticker, h, rec) {
  const prompt = `You are a portfolio analyst. Analyze ${ticker} and give a concise 2-sentence investment recommendation.

Current data:
- Price: $${h.price.toFixed(2)}
- SA Quant Score: ${h.score || 'N/A'} (${h.quantLabel || 'N/A'})
- Momentum Grade: ${h.momentum || 'N/A'}
- Analyst Upside: ${h.upside ? h.upside.toFixed(0)+'%' : 'N/A'}
- Today: ${h.todayPct ? sign(h.todayPct)+h.todayPct.toFixed(2)+'%' : 'N/A'}
- Data signals score: ${rec.score}/100 (${rec.verdict})

Respond in exactly this JSON format:
{"summary": "2-sentence max recommendation", "key_risk": "biggest risk in 10 words", "catalyst": "next catalyst in 10 words"}`;

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        messages: [{role:'user', content:prompt}]
      })
    });
    const d = await r.json();
    const text = d.content?.find(b => b.type==='text')?.text || '';
    const m = text.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);
  } catch(e) {}
  return null;
};

// ── Overview ──────────────────────────────────────────────────────────────────
function allocateAccounts(holdings){
  const acctMap={};
  const splits=getAccts();
  // Build lot account map as fallback — use imported lots to auto-assign accounts
  const lotAcctMap={};
  getLots().forEach(l=>{ if(!lotAcctMap[l.ticker])lotAcctMap[l.ticker]=l.account; });
  holdings.forEach(h=>{
    const raw=splits[h.ticker];const split=Array.isArray(raw)?raw:[];
    const pps=h.value/h.shares;
    if(!split.length){
      // Use lot account if available, else Untagged
      const acct=lotAcctMap[h.ticker]||"—";
      if(!acctMap[acct])acctMap[acct]={value:0,today:0,gain:0,cost:0,holdings:[]};
      acctMap[acct].value+=h.value;
      acctMap[acct].today+=(h.todayPct/100)*h.value;
      const gp=h.gainPct||0;
      const hcost=h.gainDol!==undefined?h.value-h.gainDol:h.value*100/(100+gp);
      acctMap[acct].gain+=h.value-hcost;acctMap[acct].cost+=hcost;
      acctMap[acct].holdings.push({...h,allocShares:h.shares,allocValue:h.value});
    } else {
      const totalTagged=split.reduce((s,sp)=>s+(+sp.shares),0);
      split.forEach(sp=>{
        const frac=(+sp.shares)/Math.max(totalTagged,h.shares);
        const val=h.value*frac;
        const gp2=h.gainPct||0;
        const hcost=(h.gainDol!==undefined?(h.value-h.gainDol)*frac:h.value*100/(100+gp2)*frac);
        if(!acctMap[sp.account])acctMap[sp.account]={value:0,today:0,gain:0,cost:0,holdings:[]};
        acctMap[sp.account].value+=val;
        acctMap[sp.account].today+=(h.todayPct/100)*val;
        acctMap[sp.account].gain+=val-hcost;acctMap[sp.account].cost+=hcost;
        acctMap[sp.account].holdings.push({...h,allocShares:+sp.shares,allocValue:val});
      });
      if(totalTagged<h.shares){
        const rem=h.shares-totalTagged;const val=pps*rem;
        const gp3=h.gainPct||0;
        const hcost=(h.gainDol!==undefined?(h.value-h.gainDol)*(rem/h.shares):h.value*100/(100+gp3)*(rem/h.shares));
        if(!acctMap["—"])acctMap["—"]={value:0,today:0,gain:0,cost:0,holdings:[]};
        acctMap["—"].value+=val;acctMap["—"].today+=(h.todayPct/100)*val;
        acctMap["—"].gain+=val-hcost;acctMap["—"].cost+=hcost;
        acctMap["—"].holdings.push({...h,allocShares:rem,allocValue:val});
      }
    }
  });
  return acctMap;
}

function getSplit(ticker){
  const val=getAccts()[ticker];
  if(!val)return[];
  if(Array.isArray(val))return val;
  return[]; // old string format — drop it, user will re-tag
}

function addToWatchlist() {
  const inp = document.getElementById('wl-input');
  const ticker = (inp?.value||'').toUpperCase().trim();
  if (!ticker) return;
  const wl = getWatchlist();
  if (wl.find(w => w.ticker===ticker)) { toast(ticker+' already in watchlist'); return; }
  wl.push({ticker, addedDate: new Date().toISOString().split('T')[0]});
  saveWatchlist(wl);
  watchlist = wl;
  if (inp) inp.value = '';
  // Fetch price immediately
  const settings = getSettings();
  if (settings.finnhubKey) {
    fetchPrice(ticker).then(p => {
      if (p) { prices[ticker] = p; renderWatchlist(document.getElementById('app')); }
    });
  }
  renderWatchlist(document.getElementById('app'));
}

window.removeFromWatchlist = ticker => {
  const wl = getWatchlist().filter(w => w.ticker !== ticker);
  saveWatchlist(wl);
  watchlist = wl;
  delete prices[ticker];
  renderWatchlist(document.getElementById('app'));
};

window.refreshAllPrices = async () => {
  const wl = getWatchlist();
  toast('Refreshing ' + wl.length + ' prices...');
  const tickers = wl.map(w => w.ticker);
  const p = await fetchPrices(tickers);
  Object.assign(prices, p);
  renderWatchlist(document.getElementById('app'));
  toast('Prices updated');
};

// ── Ally Vertical parser (copy-paste from Ally Holdings page) ────────────────
function parseAllyVertical(raw, account='Ally') {
  raw = raw.replace(/^\uFEFF/, '');
  const n = s => parseFloat((s||'').replace(/[$,%()\s]/g,'').replace(/^[+\s]+/,'')) || 0;
  const signed = s => {
    const neg = s.includes('-');
    return Math.abs(n(s)) * (neg ? -1 : 1);
  };
  const lines = raw.trim().split('\n').map(l => l.trim()).filter(l => l);
  const SKIP = ['Holdings','Sym',"Today's G/L","Change $","(%)","Total G/L","Qty","Mkt Value",
    "Today's Gain/Loss","Change","Total Gain/Loss","Market Value","Quantity"];
  let i = 0;
  while (i < lines.length && SKIP.includes(lines[i])) i++;
  const rows = [];
  while (i < lines.length) {
    const ticker = lines[i].toUpperCase().replace(/[^A-Z]/g,'');
    if (!ticker || ticker.length > 6 || ticker.length < 1) { i++; continue; }
    i++;
    // Skip company name (long non-numeric line)
    if (i < lines.length && !/^\$/.test(lines[i]) && !/^\d+$/.test(lines[i]) && lines[i].length > 3 && !/^\(/.test(lines[i])) i++;
    // Skip single-char flags (D=dividend, etc)
    while (i < lines.length && /^[A-Z]$/.test(lines[i])) i++;
    // Collect 7 data lines
    const chunk = [];
    while (i < lines.length && chunk.length < 7) {
      const line = lines[i];
      if (/^[A-Z]{1,6}$/.test(line) && chunk.length >= 4) break;
      if (SKIP.includes(line)) break;
      chunk.push(line); i++;
    }
    if (chunk.length < 6) continue;
    // chunk[0]=todayGL$, [1]=change$ signed, [2]=change%, [3]=totalGL$, [4]=totalGL%, [5]=qty, [6]=mktVal
    // Sign comes from chunk[1] (change$), magnitude from chunk[2] (change%)
    const changeNeg = chunk[1].trim().startsWith('-');
    const changePct = (changeNeg ? -1 : 1) * Math.abs(parseFloat((chunk[2]||'').replace(/[()%\s]/g,''))||0);
    const totalNeg  = chunk[3].trim().startsWith('-') || (chunk[3].trim().startsWith('$') && parseFloat(chunk[3].replace(/[$,\s]/g,'')) < 0);
    const totalPct  = signed(chunk[4]) * (totalNeg && signed(chunk[4]) > 0 ? -1 : 1);
    const qty       = n(chunk[5]);
    const mktVal    = n(chunk[6]);
    const totalGL   = signed(chunk[3]);
    const price     = qty > 0 ? mktVal / qty : 0;
    const costBasis = mktVal - totalGL;
    const avgCost   = qty > 0 ? costBasis / qty : 0;
    if (ticker && qty > 0 && price > 0) {
      rows.push({ticker, shares:qty, price, value:mktVal,
        costBasis, avgCost, gainDol:totalGL, gainPct:totalPct,
        todayPct:changePct, account});
    }
  }
  return rows;
}

// ── SA parser (vertical format) ───────────────────────────────────────────────
function parseSA(raw) {
  raw = raw.replace(/^\uFEFF/, '');
  const lines = raw.trim().split('\n').map(l => l.trim()).filter(l => l);
  const n = s => parseFloat((s||'').replace(/[$,%]/g,'').replace(/,/g,''))||0;
  const SKIP = ['Symbol','Sort by','Shares','Value','Price','Today','Quant','SA Analyst','Total','Momentum','Days','Upcoming','Announce'];
  const rows = [];
  let i = 0;
  while (i < lines.length && SKIP.some(h => lines[i].startsWith(h))) i++;
  while (i < lines.length) {
    const ticker = lines[i].toUpperCase().replace(/[^A-Z]/g,'');
    if (!ticker || ticker.length>6 || ticker.length<2) { i++; continue; }
    i++;
    const chunk = []; let j = i;
    while (j < lines.length && chunk.length < 14) {
      const line = lines[j];
      if (/^[A-Z]{2,6}$/.test(line) && chunk.length>5) break;
      if (line.startsWith('Post.')||line.startsWith('Pre.')||line.startsWith('AH.')) { j++; continue; }
      if (SKIP.some(h => line.startsWith(h))) { j++; continue; }
      chunk.push(line); j++;
    }
    i = j;
    if (chunk.length < 5) continue;
    const shares = n(chunk[0]), value = n(chunk[1]), price = n(chunk[2]);
    const todayPct = n(chunk[4]);
    const rLines = chunk.filter(l => l.startsWith('Rating:') && /\d+\.\d+$/.test(l) && !l.includes('Not Covered'));
    const qLine = rLines[0]||'';
    const score = qLine ? parseFloat(qLine.match(/(\d+\.\d+)$/)?.[1]||0) : 0;
    const quantLabel = qLine ? qLine.replace(/Rating:\s*/,'').replace(/\d+\.\d+$/,'').trim() : '';
    const saLine = rLines[1]||'';
    const saScore = saLine ? parseFloat(saLine.match(/(\d+\.\d+)$/)?.[1]||0) : 0;
    const saLabel = saLine ? saLine.replace(/Rating:\s*/,'').replace(/\d+\.\d+$/,'').trim() : '';
    const pctLines = chunk.filter(l => /^-?\d+\.?\d*%$/.test(l));
    const gainPct = pctLines.length>1 ? n(pctLines[pctLines.length-1]) : 0;
    const momentum = chunk.find(l => /^[A-D][+-]?$/.test(l))||'';
    const saEarnings = chunk.find(l => /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(l))||'';
    if (ticker && price>0 && shares>0) {
      rows.push({ticker, shares, value, price, todayPct, gainPct, score, quantLabel,
        saScore, saLabel, momentum, saEarnings, upside:0, trScore:0});
    }
  }
  return rows.sort((a,b) => b.value-a.value);
}



// ── TipRanks parser ────────────────────────────────────────────────────────
function parseTR(raw) {
  raw = raw.replace(/^\uFEFF/, '');
  const lines = raw.trim().split('\n').map(l => l.trim()).filter(l => l);
  const n = s => parseFloat((s||'').replace(/[$,%()]/g,'').replace(/,/g,'').trim()) || 0;
  const rows = [];
  let header = null;
  let tI=0,sharesI=2,priceI=3,pctI=4,consI=5,upsideI=6,scoreI=8,valI=9,gainDolI=10,gainPctI=11;
  for (const line of lines) {
    const cols = line.split('\t').map(c => c.trim());
    if (!header) {
      header = cols.map(c => c.toLowerCase());
      header.forEach((h,i) => {
        if (h==='ticker') tI=i;
        else if (h.includes('shares')) sharesI=i;
        else if (h==='price') priceI=i;
        else if (h==='% change') pctI=i;
        else if (h.includes('consensus')) consI=i;
        else if (h.includes('target %')) upsideI=i;
        else if (h.includes('smart')) scoreI=i;
        else if (h.includes('value')) valI=i;
        else if (h.includes('gain change') && !h.includes('%')) gainDolI=i;
        else if (h.includes('gain change %')) gainPctI=i;
      });
      continue;
    }
    const ticker = cols[tI];
    if (!ticker || !/^[A-Z]{1,6}$/.test(ticker)) continue;
    const shares   = n(cols[sharesI]);
    const price    = n(cols[priceI]);
    const todayPct = n(cols[pctI]);
    const upside   = n(cols[upsideI]);
    const trScore  = n(cols[scoreI]);
    const value    = n(cols[valI]) || price*shares;
    const gainDol  = n(cols[gainDolI]);
    const gainPct  = n(cols[gainPctI]);
    const consensus= cols[consI]||'';
    if (ticker && shares>0 && price>0) {
      rows.push({ticker, shares, price, value, todayPct, upside, trScore,
        gainDol, gainPct, consensus, score:0, quantLabel:'', momentum:'', account:''});
    }
  }
  return rows.sort((a,b)=>b.value-a.value);
}

// ── Schwab CSV as holdings display source ─────────────────────────────────
function parseSchwabAsHoldings(raw) {
  raw = raw.replace(/^\uFEFF/, '');
  const lines = raw.trim().split('\n').map(l => l.trim()).filter(l => l);
  const n = s => parseFloat((s||'').replace(/[$,%()]/g,'').replace(/,/g,'').trim()) || 0;
  const rows = [];
  let header = null;
  let symI=0,qtyI=2,priceI=3,pricePctI=4,priceDolI=5,valI=6,dayDolI=7,dayPctI=8,costI=9,gainDolI=10,gainPctI=11;
  for (const line of lines) {
    const cols = line.split('\t').map(c => c.trim());
    if (!header) {
      header = cols.map(c => c.toLowerCase());
      // Find columns by header name
      header.forEach((h,i) => {
        if (h.includes('symbol')) symI=i;
        else if (h.includes('qty') || h.includes('quantity')) qtyI=i;
        else if (h==='price') priceI=i;
        else if (h.includes('price chng %') || h.includes('price change %')) pricePctI=i;
        else if (h.includes('price chng $') || h.includes('price change $')) priceDolI=i;
        else if (h.includes('mkt val') || h.includes('market value')) valI=i;
        else if (h.includes('day chng $') || h.includes('day change $')) dayDolI=i;
        else if (h.includes('day chng %') || h.includes('day change %')) dayPctI=i;
        else if (h.includes('cost basis')) costI=i;
        else if (h.includes('gain $') || h.includes('gain/loss $')) gainDolI=i;
        else if (h.includes('gain %') || h.includes('gain/loss %')) gainPctI=i;
      });
      continue;
    }
    const sym = cols[symI];
    if (!sym || !/^[A-Z]{1,6}$/.test(sym)) continue;
    const qty     = n(cols[qtyI]);
    const price   = n(cols[priceI]);
    const val     = n(cols[valI]) || price*qty;
    const cost    = n(cols[costI]);
    const gainDol = n(cols[gainDolI]);
    const gainPct = n(cols[gainPctI]);
    const todayPct= n(cols[dayPctI]);
    if (qty > 0 && price > 0) {
      rows.push({
        ticker: sym,
        shares: qty,
        price,
        value: val,
        gainDol,
        gainPct,
        todayPct,
        costBasis: cost,
        avgCost: qty > 0 ? cost/qty : 0,
        score: 0,
        quantLabel: '',
        momentum: '',
        upside: 0,
        trScore: 0,
        account: 'Schwab',
      });
    }
  }
  return rows.sort((a,b) => b.value - a.value);
}

window.runImport = () => {
  const statusEl = document.getElementById('import-status');
  if (statusEl) statusEl.textContent = 'Parsing...';
  const saRaw     = document.getElementById('sa-raw')?.value||'';
  const schwabRaw = document.getElementById('schwab-raw')?.value||'';
  // Ally handled below via 3 separate boxes
  let imported = [];

  // Holdings paste — auto-detects SA vertical, Schwab CSV, or Ally vertical
  if (saRaw.trim()) {
    const el = document.getElementById('sa-result');
    const raw = saRaw.replace(/^\uFEFF/,'');
    let rows = [];
    let fmt = '';

    if (raw.includes('Smart Score') || (raw.includes('Analyst Consensus') && raw.includes('Ticker'))) {
      // TipRanks portfolio paste
      rows = parseTR(raw);
      fmt = 'TipRanks';
    } else if (raw.includes('\t') && (raw.includes('Symbol\t') || raw.match(/^Symbol[\t ]/m) || raw.includes('Qty (Quantity)'))) {
      // Schwab-style TSV
      rows = parseSchwabAsHoldings(raw);
      fmt = 'Schwab CSV';
    } else if (raw.includes('Rating:') || raw.includes('Sort by')) {
      rows = parseSA(raw);
      fmt = 'SA Vertical';
    } else if (raw.includes('Holdings') && raw.includes('Mkt Value')) {
      rows = parseAllyVertical(raw, 'Portfolio');
      fmt = 'Ally Vertical';
    } else {
      rows = parseSA(raw);
      fmt = 'SA (auto)';
    }

    if (rows.length) {
      holdings = rows;
      setJSON(STORAGE.HOLDINGS, rows);
      if (el) el.textContent = '✅ '+rows.length+' positions loaded ('+fmt+')';
      ls(STORAGE.SA_RAW, saRaw);
      imported.push('Holdings ('+rows.length+'p)');
    } else {
      const firstLines = raw.trim().split('\n').slice(0,3).map(l=>l.trim().substring(0,50));
      if (el) el.innerHTML = '❌ No positions found (tried '+fmt+')<br><small style="color:#94a3b8">'+firstLines.join(' | ')+'</small>';
    }
  }

  // Schwab → lots
  if (schwabRaw.trim()) {
    const rows = parseSchwab(schwabRaw, 'Schwab');
    if (rows.length) {
      // Convert to open lots for ROI tracker
      const existing = getROI().filter(t => t.account !== 'Schwab' || t.type === 'sell');
      const newBuys  = rows.map(r => ({
        id: Date.now()+Math.random(),
        type: 'buy',
        ticker: r.ticker,
        account: 'Schwab',
        shares: r.shares,
        price: r.avgCost,
        date: '',  // unknown — Schwab CSV doesn't include buy date at position level
        reason: 'Imported from Schwab',
        imported: true,
      }));
      // Remove old Schwab imports, add new ones
      const cleaned = getROI().filter(t => !t.imported || t.account !== 'Schwab');
      saveROI([...cleaned, ...newBuys]);
      document.getElementById('schwab-result').textContent = '✅ '+rows.length+' positions imported as lots';
      ls(STORAGE.SCHWAB_RAW, schwabRaw);
      imported.push('Schwab ('+rows.length+'p)');
    } else {
      document.getElementById('schwab-result').textContent = '❌ No positions found — check format';
    }
  }

  // Ally → lots (3 accounts combined)
  const allyRaws = [
    document.getElementById('ally-raw-1')?.value||'',
    document.getElementById('ally-raw-2')?.value||'',
    document.getElementById('ally-raw-3')?.value||'',
  ].filter(r => r.trim());
  if (allyRaws.length) {
    let allAllyRows = [];
    allyRaws.forEach(raw => {
      const rows = parseAllyVertical(raw, 'Ally');
      allAllyRows = allAllyRows.concat(rows);
    });
    if (allAllyRows.length) {
      const newBuys = allAllyRows.map(r => ({
        id: Date.now()+Math.random(),
        type: 'buy',
        ticker: r.ticker,
        account: 'Ally',
        shares: r.shares,
        price: r.avgCost,
        date: '',
        reason: 'Imported from Ally',
        imported: true,
      }));
      const cleaned = getROI().filter(t => !t.imported || t.account !== 'Ally');
      saveROI([...cleaned, ...newBuys]);
      const el = document.getElementById('ally-result');
      if (el) el.textContent = '✅ '+allAllyRows.length+' positions imported from '+allyRaws.length+' Ally account(s)';
      allyRaws.forEach((r,i)=>{ if(r.trim()) ls(STORAGE['ALLY'+(i+1)],r); });
      imported.push('Ally ('+allAllyRows.length+'p)');
    } else {
      const el = document.getElementById('ally-result');
      if (el) el.textContent = '❌ No positions found — check format';
    }
  }

  // Also merge Ally holdings into display holdings if no SA pasted
  if (!saRaw.trim() && allyRaws.length) {
    let allAllyHoldings = [];
    allyRaws.forEach(raw => {
      const rows = parseAllyVertical(raw, 'Ally');
      allAllyHoldings = allAllyHoldings.concat(rows);
    });
    if (allAllyHoldings.length) {
      // Merge with existing holdings or replace
      const existing = holdings.filter(h => !allAllyHoldings.find(a => a.ticker===h.ticker));
      holdings = [...existing, ...allAllyHoldings];
      setJSON(STORAGE.HOLDINGS, holdings);
    }
  }

  if (imported.length) {
    // Force re-render with current in-memory holdings
    tab = 'overview';
    toast('✅ Imported: '+imported.join(', '));
    render();
  } else {
    // Show what was detected
    const saLen = saRaw.trim().length;
    const schLen = schwabRaw.trim().length;
    const allyLen = allyRaws.reduce((s,r)=>s+r.trim().length,0);
    toast('Nothing imported — SA:'+saLen+'chars Schwab:'+schLen+'chars Ally:'+allyLen+'chars');
  }
};

window.saveQuantScore = (ticker, val) => {

window.clearAll = () => {

};


// ── Portfolio Intelligence ────────────────────────────────────────────────
function renderIntel(app) {
  const intel = getIntel();
  const actionColor = a => a==='pass'?'#dc2626':a==='watch'?'#f59e0b':a==='hold'?'#16a34a':'#2563eb';
  const actionLabel = a => a==='pass'?'⛔ Pass':a==='watch'?'👁 Watch':a==='hold'?'✅ Hold':'📋 Note';
  const actionOrder = {hold:0, note:1, watch:2, pass:3};
  const tickers = Object.keys(intel).sort((a,b) => {
    const ao = actionOrder[intel[a].action]??1;
    const bo = actionOrder[intel[b].action]??1;
    return ao !== bo ? ao - bo : a.localeCompare(b);
  });

  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:18px;font-weight:800">📋 Portfolio Intelligence</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px">Session history, exit reasons, and trade rules seeded from your conversations</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="addIntelEntry()">+ Add Entry</button>
    </div>

    <div id="intel-add-form" style="display:none" class="card" style="margin-bottom:16px;border-color:#2563eb">
      <div style="display:grid;grid-template-columns:100px 120px 1fr;gap:10px;margin-bottom:10px">
        <div><label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">Ticker</label>
          <input id="intel-ticker" placeholder="NVDA" style="text-transform:uppercase"></div>
        <div><label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">Action</label>
          <select id="intel-action">
            <option value="pass">⛔ Pass</option>
            <option value="watch">👁 Watch</option>
            <option value="hold">✅ Hold</option>
            <option value="note">📋 Note</option>
          </select></div>
        <div><label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">Reason</label>
          <input id="intel-reason" placeholder="Why this action..."></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="saveIntelEntry()">Save</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('intel-add-form').style.display='none'">Cancel</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      ${tickers.map(t => {
        const e = intel[t];
        const col = actionColor(e.action);
        return `<div class="card" style="border-left:4px solid ${col};padding:12px 16px">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
            <div style="display:flex;align-items:center;gap:12px;flex:1">
              <div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:16px;font-weight:800">${t}</span>
                  <span style="font-size:11px;font-weight:700;color:${col};background:${col}18;padding:2px 8px;border-radius:10px">${actionLabel(e.action)}</span>
                  ${(e.tags||[]).map(tag=>`<span style="font-size:10px;color:#94a3b8;background:#f1f5f9;padding:1px 6px;border-radius:8px">${tag}</span>`).join('')}
                </div>
                <div style="font-size:12px;color:#475569;margin-top:4px;line-height:1.5">${e.reason}</div>
                ${e.exitDate?`<div style="font-size:10px;color:#94a3b8;margin-top:2px">Exited: ${e.exitDate}</div>`:''}
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0">
              <button onclick="editIntelEntry('${t}')"
                style="border:none;background:#f1f5f9;color:#475569;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px">Edit</button>
              <button onclick="deleteIntelEntry('${t}')"
                style="border:none;background:#fee2e2;color:#dc2626;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px">Del</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  window.addIntelEntry = () => {
    document.getElementById('intel-add-form').style.display = 'block';
    document.getElementById('intel-ticker').focus();
  };
  window.saveIntelEntry = () => {
    const ticker = (document.getElementById('intel-ticker')?.value||'').toUpperCase().trim();
    const action = document.getElementById('intel-action')?.value||'note';
    const reason = document.getElementById('intel-reason')?.value||'';
    if (!ticker || !reason) return;
    const d = getIntel();
    d[ticker] = {action, reason, addedDate: new Date().toISOString().split('T')[0], tags:[]};
    saveIntel(d);
    renderIntel(app);
  };
  window.editIntelEntry = ticker => {
    const e = getIntel()[ticker];
    document.getElementById('intel-add-form').style.display = 'block';
    document.getElementById('intel-ticker').value = ticker;
    document.getElementById('intel-action').value = e.action||'note';
    document.getElementById('intel-reason').value = e.reason||'';
    document.getElementById('intel-ticker').focus();
  };
  window.deleteIntelEntry = ticker => {
    const d = getIntel();
    delete d[ticker];
    saveIntel(d);
    renderIntel(app);
  };
}

// ── Account split editor (ported from v1) ─────────────────────────────────
function setSingleAcct(ticker,acct,shares){
  const d=getAccts();
  if(acct==="—")delete d[ticker];
  else d[ticker]=[{account:acct,shares:shares}];
  saveAccts(d);render();
}

window.openSplitEditor=(ticker,totalShares)=>{
  const splits=getAccts();
  const current=splits[ticker]||[];
  const tagged=current.reduce((s,sp)=>s+(+sp.shares),0);
  const remaining=totalShares-tagged;
  const accounts=["Schwab","Ally","Vanguard","Other"];
  const modal=document.createElement("div");
  modal.id="split-modal";
  modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center";
  modal.innerHTML=`
    <div style="background:#fff;border-radius:14px;padding:24px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.2)">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">${ticker} — Account Split</div>
      <div style="font-size:12px;color:#64748b;margin-bottom:16px">Total: ${totalShares} shares · Tagged: ${tagged} · Remaining: ${remaining}</div>
      <div id="split-rows">
        ${current.map((sp,i)=>`
          <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
            <select id="sp-acct-${i}" style="flex:1;padding:7px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;background:#fff">
              ${accounts.map(a=>`<option value="${a}"${sp.account===a?" selected":""}>${a}</option>`).join("")}
            </select>
            <input type="number" id="sp-shares-${i}" value="${sp.shares}" min="1" max="${totalShares}"
              style="width:80px;padding:7px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px">
            <span style="font-size:11px;color:#94a3b8">sh</span>
          </div>`).join("")}
        <button onclick="addSplitRow(${totalShares})" style="width:100%;padding:7px;border:1px dashed #cbd5e1;border-radius:7px;font-size:12px;color:#64748b;background:none;cursor:pointer;margin-bottom:8px">+ Add account</button>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="saveSplitEditor('${ticker}',${totalShares})" class="btn btn-p" style="flex:1;padding:9px">Save</button>
        <button onclick="document.getElementById('split-modal')?.remove()" class="btn btn-s" style="padding:9px 16px">Cancel</button>
        ${current.length?`<button onclick="clearSplit('${ticker}')" style="padding:9px 12px;border:none;border-radius:8px;background:#fee2e2;color:#dc2626;cursor:pointer;font-size:12px">Clear</button>`:""}
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener("click",e=>{if(e.target===modal)modal.remove();});
};

window.addSplitRow=(totalShares)=>{
  const rows=document.getElementById("split-rows");if(!rows)return;
  const i=rows.querySelectorAll("input[type=number]").length;
  const accounts=["Schwab","Ally","Vanguard","Other"];
  const div=document.createElement("div");
  div.style.cssText="display:flex;gap:8px;margin-bottom:8px;align-items:center";
  div.innerHTML=`
    <select id="sp-acct-${i}" style="flex:1;padding:7px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;background:#fff">
      ${accounts.map(a=>`<option>${a}</option>`).join("")}
    </select>
    <input type="number" id="sp-shares-${i}" placeholder="shares" min="1" max="${totalShares}"
      style="width:72px;padding:7px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px"
      oninput="updateSplitRemaining(${totalShares})">
    <button onclick="useRemaining(${totalShares},${i})" title="Use all remaining shares"
      style="padding:4px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:10px;background:#f8fafc;cursor:pointer;white-space:nowrap">All</button>`;
  rows.insertBefore(div, rows.lastElementChild);
};

window.useRemaining=(totalShares,idx)=>{
  const inputs=[...document.getElementById("split-rows").querySelectorAll("input[type=number]")];
  const used=inputs.reduce((s,inp,i)=>i!==idx?s+(parseFloat(inp.value)||0):s,0);
  const rem=totalShares-used;
  const inp=document.getElementById("sp-shares-"+idx);
  if(inp&&rem>0)inp.value=rem;
  updateSplitRemaining(totalShares);
};

window.updateSplitRemaining=(totalShares)=>{
  const inputs=document.getElementById("split-rows")?.querySelectorAll("input[type=number]")||[];
  const used=[...inputs].reduce((s,inp)=>s+(parseFloat(inp.value)||0),0);
  const rem=totalShares-used;
  const errEl=document.getElementById("split-err");
  if(errEl)errEl.textContent=used>0?(rem>=0?"Remaining: "+rem+" shares":(used-totalShares)+" shares over limit"):"";
  if(errEl)errEl.style.color=rem<0?"#dc2626":"#16a34a";
};

window.saveSplitEditor=(ticker,totalShares)=>{
  const inputs=document.getElementById("split-rows")?.querySelectorAll("input[type=number]")||[];
  const newSplits=[];let total=0;
  inputs.forEach((inp,i)=>{
    const shares=parseFloat(inp.value||0);
    const acct=document.getElementById(`sp-acct-${i}`)?.value||"Schwab";
    if(shares>0){newSplits.push({account:acct,shares});total+=shares;}
  });
  const errEl=document.getElementById("split-err");
  if(total>totalShares){if(errEl)errEl.textContent=`Total ${total} exceeds ${totalShares} shares`;return;}
  const d=getAccts();
  if(newSplits.length)d[ticker]=newSplits;
  else delete d[ticker];
  saveAccts(d);
  document.getElementById("split-modal")?.remove();
  render();
};

window.removeSplit=(ticker,idx)=>{
  const d=getAccts();
  if(d[ticker]){d[ticker].splice(idx,1);if(!d[ticker].length)delete d[ticker];}
  saveAccts(d);render();
};

window.clearSplit=(ticker)=>{
  const d=getAccts();delete d[ticker];saveAccts(d);
  document.getElementById("split-modal")?.remove();
  render();
};

      else if (raw.includes('\t') && raw.includes('Qty')) rows = parseSchwabAsHoldings(raw);
      else rows = parseSA(raw);
      if (rows.length) { holdings = rows; setJSON(STORAGE.HOLDINGS, rows); }
    }
    if (!holdings.length && schwabRaw.trim()) {
      const rows = parseSchwabAsHoldings(schwabRaw);
      if (rows.length) { holdings = rows; setJSON(STORAGE.HOLDINGS, rows); }
    }
  }

  watchlist = getWatchlist();
  roi = getROI();
  render();
})();
